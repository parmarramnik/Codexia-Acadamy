# Production overrides. Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.production up -d --build
# Differences from the local stack: DEBUG off, no demo data, secrets REQUIRED (compose refuses to start
# without them), nothing but the TLS edge is published, memory limits, 2 workers per service.

x-prod-env: &prod-env
  DEBUG: "false"
  SEED_DEMO_DATA: "false"
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY (>= 32 random chars) in .env.production}
  FRONTEND_URL: ${FRONTEND_URL:?set FRONTEND_URL, e.g. https://app.example.com}
  CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS, e.g. https://app.example.com}
  WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
  REDIS_REQUIRED: ${REDIS_REQUIRED:-true}

services:
  postgres:
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
  redis:
    ports: !reset []
  gateway:
    ports: !reset []
    environment: *prod-env
    mem_limit: 512m
  frontend:
    ports: !reset []
    mem_limit: 128m
  migrate:
    environment: *prod-env
  auth_service:
    environment: *prod-env
    mem_limit: 512m
  course_service:
    environment: *prod-env
    mem_limit: 512m
  quiz_service:
    environment: *prod-env
    mem_limit: 512m
  coding_service:
    environment: *prod-env
    mem_limit: 512m
  analytics_service:
    environment: *prod-env
    mem_limit: 512m
  payment_service:
    environment: *prod-env
    mem_limit: 512m
  ai_service:
    environment:
      <<: *prod-env
      WEB_CONCURRENCY: "1"
    mem_limit: 2g

  edge:                                  # automatic HTTPS (Let's Encrypt) in front of everything
    image: caddy:2-alpine
    container_name: codexia_edge
    restart: unless-stopped
    depends_on:
      frontend: {condition: service_healthy}
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN, e.g. app.example.com}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL for certificate notices}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
