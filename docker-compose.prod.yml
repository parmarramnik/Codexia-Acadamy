# ==============================================================================
# Codexia LMS - Production Compose Configuration
# Zero-Trust Network Isolation & Strict Security Policy
# ==============================================================================

services:
  postgres:
    image: postgres:15-alpine
    container_name: codexia_prod_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codexia_lms}
      POSTGRES_USER: ${POSTGRES_USER:-codexia_admin}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Error POSTGRES_PASSWORD environment variable must be set in production}"
    # Security: No ports exposed to host. Internal communication only.
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - codexia_prod_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-codexia_admin} -d ${POSTGRES_DB:-codexia_lms}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: codexia_prod_cache
    restart: always
    # Security: No ports exposed to host. Internal communication only.
    volumes:
      - redis_prod_data:/data
    networks:
      - codexia_prod_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth_service:
    build:
      context: ./backend
      dockerfile: microservices/auth_service/Dockerfile
    container_name: codexia_prod_auth
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Security: Internal microservice - no host port binding
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-codexia_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-codexia_lms}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - APP_NAME=Codexia Auth Service
      - DEBUG=false
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - FROM_EMAIL=${FROM_EMAIL:-noreply@codexia.com}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - INSTRUCTOR_EMAIL=${INSTRUCTOR_EMAIL:-}
    networks:
      - codexia_prod_network

  course_service:
    build:
      context: ./backend
      dockerfile: microservices/course_service/Dockerfile
    container_name: codexia_prod_course
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Security: Internal microservice - no host port binding
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-codexia_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-codexia_lms}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - APP_NAME=Codexia Course Service
      - DEBUG=false
    volumes:
      - static_prod_data:/app/static
    networks:
      - codexia_prod_network

  quiz_service:
    build:
      context: ./backend
      dockerfile: microservices/quiz_service/Dockerfile
    container_name: codexia_prod_quiz
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Security: Internal microservice - no host port binding
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-codexia_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-codexia_lms}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - APP_NAME=Codexia Quiz Service
      - DEBUG=false
    volumes:
      - static_prod_data:/app/static
    networks:
      - codexia_prod_network

  coding_service:
    build:
      context: ./backend
      dockerfile: microservices/coding_service/Dockerfile
    container_name: codexia_prod_coding
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Security: Internal microservice - no host port binding
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-codexia_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-codexia_lms}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - APP_NAME=Codexia Coding Service
      - DEBUG=false
    networks:
      - codexia_prod_network

  ai_service:
    build:
      context: ./backend
      dockerfile: microservices/ai_service/Dockerfile
    container_name: codexia_prod_ai
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Security: Internal microservice - no host port binding
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-codexia_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-codexia_lms}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - APP_NAME=Codexia AI Service
      - DEBUG=false
      - GEMINI_API_KEY="${GEMINI_API_KEY:?Error GEMINI_API_KEY must be set in production}"
    networks:
      - codexia_prod_network

  analytics_service:
    build:
      context: ./backend
      dockerfile: microservices/analytics_service/Dockerfile
    container_name: codexia_prod_analytics
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Security: Internal microservice - no host port binding
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-codexia_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-codexia_lms}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - APP_NAME=Codexia Analytics Service
      - DEBUG=false
    networks:
      - codexia_prod_network

  gateway:
    build:
      context: ./backend
      dockerfile: microservices/gateway/Dockerfile
    container_name: codexia_prod_gateway
    restart: always
    depends_on:
      - auth_service
      - course_service
      - quiz_service
      - coding_service
      - ai_service
      - analytics_service
    # Security: Internal gateway. Only frontend reverse-proxies to it.
    # If host access is needed for administration, bind strictly to 127.0.0.1.
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - AUTH_SERVICE_URL=http://auth_service:8001
      - COURSE_SERVICE_URL=http://course_service:8002
      - QUIZ_SERVICE_URL=http://quiz_service:8003
      - CODING_SERVICE_URL=http://coding_service:8004
      - AI_SERVICE_URL=http://ai_service:8005
      - ANALYTICS_SERVICE_URL=http://analytics_service:8006
      - APP_NAME=Codexia API Gateway
      - DEBUG=false
    volumes:
      - static_prod_data:/app/static
    networks:
      - codexia_prod_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: codexia_prod_frontend
    restart: always
    depends_on:
      - gateway
    # Public web ingress ports for production traffic
    ports:
      - "80:80"
      - "443:443"
    networks:
      - codexia_prod_network

volumes:
  postgres_prod_data:
  redis_prod_data:
  static_prod_data:

networks:
  codexia_prod_network:
    driver: bridge
