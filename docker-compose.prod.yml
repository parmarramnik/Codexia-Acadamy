version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: codexia_prod_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codexia_lms}
      POSTGRES_USER: ${POSTGRES_USER:-codexia_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin_secure_pwd}
    ports:
      - "5432:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-codexia_admin} -d ${POSTGRES_DB:-codexia_lms}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: codexia_prod_cache
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth_service:
    build:
      context: ./backend
      dockerfile: microservices/auth_service/Dockerfile
    container_name: codexia_prod_auth
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://codexia_admin:${POSTGRES_PASSWORD:-admin_secure_pwd}@postgres:5432/codexia_lms}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - APP_NAME=Codexia Auth Service
      - DEBUG=false
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - FROM_EMAIL=${FROM_EMAIL:-noreply@codexia.com}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - INSTRUCTOR_EMAIL=${INSTRUCTOR_EMAIL:-}

  course_service:
    build:
      context: ./backend
      dockerfile: microservices/course_service/Dockerfile
    container_name: codexia_prod_course
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8002:8002"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://codexia_admin:${POSTGRES_PASSWORD:-admin_secure_pwd}@postgres:5432/codexia_lms}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - APP_NAME=Codexia Course Service
      - DEBUG=false
    volumes:
      - static_prod_data:/app/static

  quiz_service:
    build:
      context: ./backend
      dockerfile: microservices/quiz_service/Dockerfile
    container_name: codexia_prod_quiz
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8003:8003"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://codexia_admin:${POSTGRES_PASSWORD:-admin_secure_pwd}@postgres:5432/codexia_lms}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - APP_NAME=Codexia Quiz Service
      - DEBUG=false
    volumes:
      - static_prod_data:/app/static

  coding_service:
    build:
      context: ./backend
      dockerfile: microservices/coding_service/Dockerfile
    container_name: codexia_prod_coding
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8004:8004"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://codexia_admin:${POSTGRES_PASSWORD:-admin_secure_pwd}@postgres:5432/codexia_lms}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - APP_NAME=Codexia Coding Service
      - DEBUG=false

  ai_service:
    build:
      context: ./backend
      dockerfile: microservices/ai_service/Dockerfile
    container_name: codexia_prod_ai
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8005:8005"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://codexia_admin:${POSTGRES_PASSWORD:-admin_secure_pwd}@postgres:5432/codexia_lms}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - APP_NAME=Codexia AI Service
      - DEBUG=false
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}

  analytics_service:
    build:
      context: ./backend
      dockerfile: microservices/analytics_service/Dockerfile
    container_name: codexia_prod_analytics
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8006:8006"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://codexia_admin:${POSTGRES_PASSWORD:-admin_secure_pwd}@postgres:5432/codexia_lms}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - APP_NAME=Codexia Analytics Service
      - DEBUG=false

  gateway:
    build:
      context: ./backend
      dockerfile: microservices/gateway/Dockerfile
    container_name: codexia_prod_gateway
    restart: always
    depends_on:
      - auth_service
      - course_service
      - quiz_service
      - coding_service
      - ai_service
      - analytics_service
    ports:
      - "8000:8000"
    environment:
      - AUTH_SERVICE_URL=http://auth_service:8001
      - COURSE_SERVICE_URL=http://course_service:8002
      - QUIZ_SERVICE_URL=http://quiz_service:8003
      - CODING_SERVICE_URL=http://coding_service:8004
      - AI_SERVICE_URL=http://ai_service:8005
      - ANALYTICS_SERVICE_URL=http://analytics_service:8006
      - APP_NAME=Codexia API Gateway
      - DEBUG=false
    volumes:
      - static_prod_data:/app/static

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: codexia_prod_frontend
    restart: always
    depends_on:
      - gateway
    ports:
      - "80:80"
      - "443:443"

volumes:
  postgres_prod_data:
  redis_prod_data:
  static_prod_data:
