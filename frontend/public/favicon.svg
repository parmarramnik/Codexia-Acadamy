<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="12" y1="12" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <filter id="glow" x="0" y="0" width="64" height="64" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded Squircle Background -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#glowGrad)" stroke-width="2.5" />
  
  <!-- Ambient Inner Glow -->
  <circle cx="32" cy="32" r="18" fill="#6366F1" opacity="0.18" filter="url(#glow)" />
  
  <!-- Left Bracket < -->
  <polyline points="24,20 14,32 24,44" fill="none" stroke="url(#glowGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Center Slash / Node -->
  <circle cx="32" cy="32" r="3.5" fill="#38BDF8" />
  
  <!-- Right Bracket > -->
  <polyline points="40,20 50,32 40,44" fill="none" stroke="url(#glowGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
