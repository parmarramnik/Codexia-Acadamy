# Scheme as seen by the user: trust the edge proxy's header when present.
map $http_x_forwarded_proto $fwd_proto { default $http_x_forwarded_proto; "" $scheme; }

server {
    listen 80;
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --------------------------------------------------------------------------
    # Security Hardening Headers & Policies
    # --------------------------------------------------------------------------
    server_tokens off;

    # The only hop in front of this container is our own edge proxy on a private network: take the real client
    # address from its X-Forwarded-For, then forward a single, overwritten value so clients cannot spoof it.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    client_max_body_size 520M;   # >= MAX_UPLOAD_SIZE_MB (lecture video uploads)

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Deny access to hidden dotfiles (e.g. .env, .git, .htaccess)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # --------------------------------------------------------------------------
    # Performance & Compression
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;

    # React Router HTML5 History Mode
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy API requests to backend Gateway
    # ^~ makes this win over the static-asset regex below (otherwise /api/**/x.png would 404).
    location ^~ /api/ {
        proxy_pass http://gateway:8000/api/;
        proxy_request_buffering off;   # stream uploads to the gateway instead of spooling to disk
        proxy_buffering off;           # stream video/Range responses
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Static uploads proxy
    location ^~ /static/ {
        proxy_pass http://gateway:8000/static/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Cache static assets for fast subsequent loads
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }
}
