# Full Codexia stack as ONE backend (main.py) + Postgres + Redis + frontend.
# Includes every route (payments, RAG, AI, coding). Use this for local runs:
#   docker compose -f docker-compose.full.yml up -d --build
# Frontend: http://localhost:3000   API docs: http://localhost:8000/api/docs
services:
  postgres:
    image: postgres:15-alpine
    container_name: codexia_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codexia_lms}
      POSTGRES_USER: ${POSTGRES_USER:-codexia_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin_secure_pwd}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-codexia_admin} -d ${POSTGRES_DB:-codexia_lms}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: codexia_cache
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    container_name: codexia_api
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    env_file: [.env]   # your keys (Gemini, Razorpay, mail...); values below override it
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-codexia_admin}:${POSTGRES_PASSWORD:-admin_secure_pwd}@postgres:5432/${POSTGRES_DB:-codexia_lms}
      REDIS_URL: redis://redis:6379/0
      DEBUG: "true"
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      FRONTEND_URL: http://localhost:3000
      EMBEDDING_CACHE_DIR: /app/.model-cache
    ports: ["127.0.0.1:8000:8000"]
    networks:
      default:
        aliases: [gateway]   # the frontend nginx proxies /api to host "gateway"
    volumes:
      - model_cache:/app/.model-cache
      - uploads:/app/static

  frontend:
    build: ./frontend
    container_name: codexia_frontend
    depends_on: [api]
    ports: ["3000:3000"]

volumes:
  postgres_data:
  model_cache:
  uploads:
