version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: codexia_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codexia_lms}
      POSTGRES_USER: ${POSTGRES_USER:-codexia_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin_secure_pwd}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-codexia_admin} -d ${POSTGRES_DB:-codexia_lms}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: codexia_cache
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth_service:
    build:
      context: ./backend
      dockerfile: microservices/auth_service/Dockerfile
    container_name: codexia_auth_service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql://codexia_admin:${POSTGRES_PASSWORD:-admin_secure_pwd}@postgres:5432/codexia_lms
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - APP_NAME=Codexia Auth Service
      - DEBUG=${DEBUG:-true}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - FROM_EMAIL=${FROM_EMAIL:-noreply@codexia.com}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@codexia.com}
      - INSTRUCTOR_EMAIL=${INSTRUCTOR_EMAIL:-instructor@codexia.com}
    volumes:
      - ./backend:/app

  course_service:
    build:
      context: ./backend
      dockerfile: microservices/course_service/Dockerfile
    container_name: codexia_course_service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8002:8002"
    environment:
      - DATABASE_URL=postgresql://codexia_admin:${POSTGRES_PASSWORD:-admin_secure_pwd}@postgres:5432/codexia_lms
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - APP_NAME=Codexia Course Service
      - DEBUG=${DEBUG:-true}
    volumes:
      - ./backend:/app

  quiz_service:
    build:
      context: ./backend
      dockerfile: microservices/quiz_service/Dockerfile
    container_name: codexia_quiz_service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8003:8003"
    environment:
      - DATABASE_URL=postgresql://codexia_admin:${POSTGRES_PASSWORD:-admin_secure_pwd}@postgres:5432/codexia_lms
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - APP_NAME=Codexia Quiz Service
      - DEBUG=${DEBUG:-true}
    volumes:
      - ./backend:/app

  coding_service:
    build:
      context: ./backend
      dockerfile: microservices/coding_service/Dockerfile
    container_name: codexia_coding_service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8004:8004"
    environment:
      - DATABASE_URL=postgresql://codexia_admin:${POSTGRES_PASSWORD:-admin_secure_pwd}@postgres:5432/codexia_lms
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - APP_NAME=Codexia Coding Service
      - DEBUG=${DEBUG:-true}
    volumes:
      - ./backend:/app

  ai_service:
    build:
      context: ./backend
      dockerfile: microservices/ai_service/Dockerfile
    container_name: codexia_ai_service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8005:8005"
    environment:
      - DATABASE_URL=postgresql://codexia_admin:${POSTGRES_PASSWORD:-admin_secure_pwd}@postgres:5432/codexia_lms
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - APP_NAME=Codexia AI Service
      - DEBUG=${DEBUG:-true}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - ./backend:/app

  analytics_service:
    build:
      context: ./backend
      dockerfile: microservices/analytics_service/Dockerfile
    container_name: codexia_analytics_service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8006:8006"
    environment:
      - DATABASE_URL=postgresql://codexia_admin:${POSTGRES_PASSWORD:-admin_secure_pwd}@postgres:5432/codexia_lms
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - APP_NAME=Codexia Analytics Service
      - DEBUG=${DEBUG:-true}
    volumes:
      - ./backend:/app

  gateway:
    build:
      context: ./backend
      dockerfile: microservices/gateway/Dockerfile
    container_name: codexia_api_gateway
    depends_on:
      - auth_service
      - course_service
      - quiz_service
      - coding_service
      - ai_service
      - analytics_service
    ports:
      - "8000:8000"
    environment:
      - AUTH_SERVICE_URL=http://auth_service:8001
      - COURSE_SERVICE_URL=http://course_service:8002
      - QUIZ_SERVICE_URL=http://quiz_service:8003
      - CODING_SERVICE_URL=http://coding_service:8004
      - AI_SERVICE_URL=http://ai_service:8005
      - ANALYTICS_SERVICE_URL=http://analytics_service:8006
      - APP_NAME=Codexia API Gateway
      - DEBUG=true
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: codexia_frontend
    depends_on:
      - gateway
    ports:
      - "3000:80"

volumes:
  postgres_data:
  redis_data:
